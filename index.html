<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EMA'S BARBER">
<link rel="manifest" href="manifest.webmanifest"><title>EMA'S BARBER</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial;background:#fff;color:#111}
header{padding:12px;position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;z-index:5}
.logo{text-align:center;font-weight:900;font-size:26px}.nav,.tabs{display:flex;gap:8px;align-items:center;margin-top:10px}.nav div{flex:1;text-align:center;font-weight:700}
button{padding:9px;border:1px solid #ccc;border-radius:9px;background:#fff}.tabs{padding:8px 10px;border-bottom:1px solid #ddd}.tabs button.active{background:#111;color:#fff}.view{display:none}.view.active{display:block}
.wrap{overflow:auto;height:calc(100vh - 155px)}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border:1px solid #ddd}th:first-child,td:first-child{width:85px;background:#eee}.time{text-align:center;font-size:11px;font-weight:700}.slot{height:42px;padding:3px}
.appt{background:#f3f3f3;border-left:4px solid #111;padding:6px;border-radius:7px;font-size:12px}.appt.past{background:#ffe3e7;border-left-color:#d7263d;color:#8b1423}.appt b{display:block}.apptName{text-decoration:underline dotted;cursor:pointer}.price{font-weight:800;color:#16833d}.appt.past .price{color:#a11122}
.fab{position:fixed;right:18px;bottom:20px;width:56px;height:56px;border-radius:50%;border:0;background:#111;color:#fff;font-size:30px}
dialog{border:0;border-radius:16px;width:min(92vw,460px)}form{padding:16px}label{display:block;font-size:12px;font-weight:700;margin:9px 0 4px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.service{display:grid;grid-template-columns:auto 1fr 100px;gap:8px;align-items:center;border:1px solid #ddd;border-radius:10px;padding:8px;margin-top:8px}.service input[type=checkbox]{width:auto}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.summary{padding:14px}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:10px}.big{font-size:30px;font-weight:900}
</style></head>
<body>
<header><div class="logo">✂️ EMA'S BARBER</div><div class="nav"><button id="prev">‹</button><div id="label"></div><button id="next">›</button><button id="today">Hoy</button></div></header>
<div class="tabs"><button data-v="agenda" class="active">Agenda</button><button data-v="cuadre">Cuadre</button></div>
<section id="agenda" class="view active"><div class="wrap"><table><thead><tr><th>HORA</th><th>BARBERO</th></tr></thead><tbody id="body"></tbody></table></div></section>
<section id="cuadre" class="view"><div class="summary"><div class="card"><div>Total del día</div><div class="big">$<span id="total">0.00</span></div></div><div class="card"><b>Detalle</b><div id="detail"></div></div></div></section>
<button id="newBtn" class="fab">+</button>

<dialog id="dlg"><form id="form"><h2 id="title">Nueva cita</h2>
<label>Fecha</label><input id="date" type="date" required><label>Hora</label><input id="time" type="time" step="600" required>
<label>Cliente (opcional)</label><input id="client"><label>Teléfono (opcional)</label><input id="phone">
<label>Servicios</label>
<div class="service"><input id="c1" type="checkbox"><div>✂️ Recorte</div><input id="p1" type="number" min="0" step=".01" placeholder="$"></div>
<div class="service"><input id="c2" type="checkbox"><div>🧔 Barba</div><input id="p2" type="number" min="0" step=".01" placeholder="$"></div>
<div class="service"><input id="c3" type="checkbox"><div>〰️ Cejas</div><input id="p3" type="number" min="0" step=".01" placeholder="$"></div>
<label>Notas</label><textarea id="notes"></textarea>
<div class="actions"><button type="button" id="del" style="display:none;color:#c00">Eliminar</button><button type="button" id="cancel">Cancelar</button><button>Guardar</button></div>
</form></dialog>

<script>
const K='emas_red_delete_v1';let data=JSON.parse(localStorage.getItem(K)||'null')||{appts:{}};let day=new Date(),editing=null;
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const key=(d,t)=>d+'|'+t; const save=()=>localStorage.setItem(K,JSON.stringify(data));
function showtime(t){let[h,m]=t.split(':').map(Number),ap=h<12?'A.M.':'P.M.';return `${h%12||12}:${String(m).padStart(2,'0')} ${ap}`}
function sum(a){return(a.services||[]).reduce((s,x)=>s+Number(x.price||0),0)}
function past(d,t){let [y,m,da]=d.split('-').map(Number),[h,mi]=t.split(':').map(Number);return new Date(y,m-1,da,h,mi).getTime()<Date.now()}
function render(){
 label.textContent=day.toLocaleDateString('es-PR',{weekday:'short',day:'numeric',month:'short'});body.innerHTML='';let d=ymd(day);
 for(let n=300;n<=1130;n+=10){
   let h=Math.floor(n/60),m=n%60,t=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`,tr=document.createElement('tr'),a=data.appts[key(d,t)],td1=document.createElement('td'),td2=document.createElement('td');
   td1.className='time';td1.textContent=showtime(t);td2.className='slot';
   if(a){
     let cls=past(d,t)?'appt past':'appt';
     let txt=(a.services||[]).map(s=>s.name+' $'+Number(s.price).toFixed(2)).join(' · ');
     td2.innerHTML=`<div class="${cls}"><b class="apptName">${a.client||'Cita'}</b>${txt?'<br>'+txt:''}<br><span class="price">Total $${sum(a).toFixed(2)}</span></div>`;
     td2.querySelector('.apptName').onclick=e=>{e.stopPropagation();if(confirm('¿Borrar esta cita?')){delete data.appts[key(d,t)];save();render();}};
   }
   td2.onclick=()=>openDlg(d,t);tr.append(td1,td2);body.appendChild(tr)
 }
 renderSummary();
}
function openDlg(d,t){let k=key(d,t);editing=data.appts[k]?k:null;let a=editing?data.appts[k]:{},map={};(a.services||[]).forEach(s=>map[s.name]=s.price);date.value=d;time.value=t;client.value=a.client||'';phone.value=a.phone||'';notes.value=a.notes||'';c1.checked=map.Recorte!==undefined;c2.checked=map.Barba!==undefined;c3.checked=map.Cejas!==undefined;p1.value=map.Recorte??'';p2.value=map.Barba??'';p3.value=map.Cejas??'';del.style.display=editing?'inline-block':'none';dlg.showModal()}
form.onsubmit=e=>{e.preventDefault();let arr=[];if(c1.checked)arr.push({name:'Recorte',price:Number(p1.value||0)});if(c2.checked)arr.push({name:'Barba',price:Number(p2.value||0)});if(c3.checked)arr.push({name:'Cejas',price:Number(p3.value||0)});let nk=key(date.value,time.value);if(editing&&editing!==nk)delete data.appts[editing];data.appts[nk]={client:client.value.trim(),phone:phone.value.trim(),services:arr,notes:notes.value.trim()};save();dlg.close();render()}
cancel.onclick=()=>dlg.close();del.onclick=()=>{if(editing&&confirm('¿Eliminar esta cita?')){delete data.appts[editing];save();dlg.close();render()}};
newBtn.onclick=()=>openDlg(ymd(day),'09:00');prev.onclick=()=>{day.setDate(day.getDate()-1);render()};next.onclick=()=>{day.setDate(day.getDate()+1);render()};today.onclick=()=>{day=new Date();render()};
function renderSummary(){let d=ymd(day),es=Object.entries(data.appts).filter(([k])=>k.startsWith(d+'|')),s=0;es.forEach(([k,a])=>s+=sum(a));total.textContent=s.toFixed(2);detail.innerHTML=es.length?es.map(([k,a])=>`<p><b>${showtime(k.split('|')[1])} ${a.client||'Cita'}</b> — $${sum(a).toFixed(2)}</p>`).join(''):'No hay citas.'}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(b.dataset.v).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));});
setInterval(render,60000);render();
</script></body></html>

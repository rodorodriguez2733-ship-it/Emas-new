<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><title>EMA'S BARBER</title>
<style>body{font-family:-apple-system;margin:0}header{padding:12px;position:sticky;top:0;background:white;border-bottom:1px solid #ddd}.logo{text-align:center;font-weight:900;font-size:26px;color:#d71920}.logo span{display:block;color:#222;font-size:13px;letter-spacing:6px}.nav,.tabs{display:flex;gap:8px;align-items:center;margin-top:10px}.nav div{flex:1;text-align:center;font-weight:700}button{padding:9px;border:1px solid #ccc;border-radius:9px;background:#fff}.tabs{padding:8px 10px;border-bottom:1px solid #ddd}.tabs button.active{background:#222;color:#fff}.view{display:none}.view.active{display:block}.wrap{overflow:auto;height:calc(100vh - 155px)}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border:1px solid #ddd}th:first-child,td:first-child{width:85px;background:#eee}.time{text-align:center;font-size:11px;font-weight:700}.slot{height:40px;padding:3px}.appt{background:#eef6ff;border-left:4px solid #0a84ff;padding:5px;border-radius:5px;font-size:12px}.price{font-weight:800;color:#16833d}.fab{position:fixed;right:18px;bottom:20px;width:56px;height:56px;border-radius:50%;border:0;background:#0a84ff;color:#fff;font-size:30px}dialog{border:0;border-radius:16px;width:min(92vw,450px)}form{padding:16px}label{display:block;font-size:12px;font-weight:700;margin:9px 0 4px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}.check{display:flex;gap:8px;align-items:center;padding:8px}.check input{width:auto}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.summary{padding:14px}.card{border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:10px}.big{font-size:30px;font-weight:900;color:#16833d}</style></head>
<body><header><div class="logo">EMA'S <span>BARBER</span></div><div class="nav"><button id="prev">‹</button><div id="label"></div><button id="next">›</button><button id="today">Hoy</button></div></header>
<div class="tabs"><button data-v="agenda" class="active">Agenda</button><button data-v="cuadre">Cuadre del día</button></div>
<section id="agenda" class="view active"><div class="wrap"><table><thead><tr><th>HORA</th><th>BARBERO</th></tr></thead><tbody id="body"></tbody></table></div></section>
<section id="cuadre" class="view"><div class="summary"><div class="card"><div>Total del día</div><div class="big">$<span id="total">0.00</span></div><div><span id="count">0</span> citas con precio</div></div><div class="card"><b>Servicios realizados</b><div id="svcSummary"></div></div><div class="card"><b>Detalle</b><div id="detail"></div></div></div></section>
<button id="newBtn" class="fab">+</button>
<dialog id="dlg"><form id="form"><h2 id="title">Nueva cita</h2><label>Fecha</label><input id="date" type="date" required><label>Hora</label><input id="time" type="time" step="600" required><label>Cliente (opcional)</label><input id="client"><label>Teléfono (opcional)</label><input id="phone"><label>Servicios (puedes escoger varios)</label><label class="check"><input class="svc" type="checkbox" value="Recorte">Recorte</label><label class="check"><input class="svc" type="checkbox" value="Barba">Barba</label><label class="check"><input class="svc" type="checkbox" value="Refine de cejas">Refine de cejas</label><label>Precio total (opcional)</label><input id="price" type="number" min="0" step=".01"><label>Notas (opcional)</label><textarea id="notes"></textarea><div class="actions"><button type="button" id="del" style="display:none;color:#c00">Eliminar</button><button type="button" id="cancel">Cancelar</button><button>Guardar</button></div></form></dialog>
<script>
const K='emas_multi_v2';let data=JSON.parse(localStorage.getItem(K)||'null')||{appts:{}};let day=new Date(),editing=null;
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const key=(d,t)=>d+'|'+t; const save=()=>localStorage.setItem(K,JSON.stringify(data));
function showtime(t){let[h,m]=t.split(':').map(Number),ap=h<12?'A.M.':'P.M.';return `${h%12||12}:${String(m).padStart(2,'0')} ${ap}`}
function render(){label.textContent=day.toLocaleDateString('es-PR',{weekday:'short',day:'numeric',month:'short'});body.innerHTML='';let d=ymd(day);for(let n=300;n<=1130;n+=10){let h=Math.floor(n/60),m=n%60,t=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`,tr=document.createElement('tr'),a=data.appts[key(d,t)],td1=document.createElement('td'),td2=document.createElement('td');td1.className='time';td1.textContent=showtime(t);td2.className='slot';if(a){let s=(a.services||[]).join(' + ');td2.innerHTML=`<div class="appt"><b>${a.client||'Cita'}</b>${s?'<br>'+s:''}${a.price!==''&&a.price!=null?'<br><span class="price">$'+Number(a.price).toFixed(2)+'</span>':''}</div>`}td2.onclick=()=>openDlg(d,t);tr.append(td1,td2);body.appendChild(tr)}summary()}
function summary(){let d=ymd(day),es=Object.entries(data.appts).filter(([k])=>k.startsWith(d+'|')),sum=0,c=0,sc={'Recorte':0,'Barba':0,'Refine de cejas':0};es.forEach(([k,a])=>{if(a.price!==''&&a.price!=null){sum+=Number(a.price);c++}(a.services||[]).forEach(s=>sc[s]++)});total.textContent=sum.toFixed(2);count.textContent=c;svcSummary.innerHTML=Object.entries(sc).map(([s,n])=>`<p>${s}: <b>${n}</b></p>`).join('');detail.innerHTML=es.length?es.map(([k,a])=>`<p><b>${showtime(k.split('|')[1])} ${a.client||'Cita'}</b> — ${(a.services||[]).join(', ')||'Sin servicio'} ${a.price!==''&&a.price!=null?'— $'+Number(a.price).toFixed(2):''}</p>`).join(''):'No hay citas.'}
function openDlg(d,t){let k=key(d,t);editing=data.appts[k]?k:null;let a=editing?data.appts[k]:{};date.value=d;time.value=t;client.value=a.client||'';phone.value=a.phone||'';price.value=a.price??'';notes.value=a.notes||'';document.querySelectorAll('.svc').forEach(x=>x.checked=(a.services||[]).includes(x.value));del.style.display=editing?'inline-block':'none';dlg.showModal()}
form.onsubmit=e=>{e.preventDefault();let nk=key(date.value,time.value);if(editing&&editing!==nk)delete data.appts[editing];data.appts[nk]={client:client.value.trim(),phone:phone.value.trim(),services:[...document.querySelectorAll('.svc:checked')].map(x=>x.value),price:price.value===''?'':Number(price.value),notes:notes.value.trim()};save();dlg.close();render()}
cancel.onclick=()=>dlg.close();del.onclick=()=>{if(editing&&confirm('¿Eliminar?')){delete data.appts[editing];save();dlg.close();render()}};newBtn.onclick=()=>openDlg(ymd(day),'09:00');prev.onclick=()=>{day.setDate(day.getDate()-1);render()};next.onclick=()=>{day.setDate(day.getDate()+1);render()};today.onclick=()=>{day=new Date();render()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(b.dataset.v).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));summary()});render();
</script></body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EMA'S BARBER">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>EMA'S BARBER</title>
<style>
:root{--bg:#fff;--panel:#fff;--soft:#f5f6f7;--text:#111;--muted:#69707a;--line:#e2e5e8;--gold:#d9aa43;--red:#ff3b3b;--green:#16833d}
[data-theme="dark"]{--bg:#0f1011;--panel:#17191b;--soft:#202327;--text:#f5f5f5;--muted:#a8adb4;--line:#2d3136}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
button,input,select,textarea{font:inherit}.app{max-width:1350px;margin:auto;min-height:100vh}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.logo{text-align:center}.logoMain{font-size:40px;font-weight:950;letter-spacing:-4px}.logoMain span{color:var(--gold);font-size:30px;vertical-align:5px}.logoSub{font-size:13px;letter-spacing:8px;font-weight:900}
.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-size:20px}
.switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.switch button{width:38px;height:36px;border:0;background:transparent;color:var(--text)}.switch .active{background:var(--gold);color:#111}
.sync{margin:10px 18px;padding:9px 12px;background:var(--soft);border-radius:10px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-right:7px}.dot.ok{background:#22c55e}.dot.err{background:#ef4444}
.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px}.side{display:grid;gap:14px;align-content:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}.card h3{margin:0;padding:15px 16px;font-size:19px}.services{padding:0 10px 10px}.service{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px}.price{font-weight:900}
.gold{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#f0c866,#d9aa43);font-weight:900;color:#111}
.setting{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:9px}.content{min-width:0;display:flex;flex-direction:column;max-height:calc(100vh - 120px)}.stickyAgendaHead{position:sticky;top:0;z-index:15;background:var(--bg);padding-bottom:8px}.datebar{display:grid;grid-template-columns:48px 1fr 48px 72px;gap:8px;margin-bottom:10px}.datebar>*{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}.datebox{display:flex;align-items:center;justify-content:center;font-weight:900}
.new{width:100%;height:56px;border:0;border-radius:13px;background:linear-gradient(135deg,#f0c866,#d9aa43);font-weight:900;font-size:19px;margin-bottom:10px}
.schedule{display:grid;gap:6px;overflow-y:auto;overscroll-behavior:contain;padding-right:2px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}.slot{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-height:55px}.slot.available{color:var(--muted)}.slot.past{background:#ffe7ea;border-color:#ffb3bb;color:#981627}.slot.current{background:#fff7df;border-color:var(--gold)}.time{font-weight:900}.name{font-weight:900;cursor:pointer}.svc{font-size:13px;color:var(--muted);margin-top:2px}.actions{display:flex}.actions button{border:0;background:transparent;color:var(--text);font-size:18px}.slot.past .actions button{color:var(--red)}.now{display:inline-block;margin-left:8px;background:var(--gold);color:#111;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900}
.footer{display:flex;justify-content:flex-end;gap:12px;align-items:center;padding:15px 2px;flex-wrap:wrap}.badge{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:900}
dialog{border:0;border-radius:18px;padding:0;width:min(94vw,540px);max-height:92vh;overflow:auto;background:var(--panel);color:var(--text)}dialog::backdrop{background:#0007}.modal{padding:18px}.modal h2{margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:12px;font-weight:900;margin:10px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}textarea{min-height:75px}.pick{display:grid;grid-template-columns:auto 30px 1fr 100px;gap:7px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px;margin-top:8px}.pick input[type=checkbox]{width:auto}.total{margin-top:12px;padding:12px;background:var(--soft);border-radius:11px;display:flex;justify-content:space-between;font-weight:900}.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.macts button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-weight:900}.macts .save{background:#111;color:#fff}.custom{display:grid;grid-template-columns:1fr 100px 42px;gap:7px;margin-top:8px}
@media(max-width:820px){.content{max-height:calc(100vh - 105px)}.layout{grid-template-columns:1fr}.side{display:none}.side.open{display:grid}.logoMain{font-size:31px}.logoSub{font-size:11px}.slot{grid-template-columns:78px 1fr auto}.layout{padding:10px}.top{padding:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="icon" id="menu">☰</button>
<div class="logo"><div class="logoMain">EM<span>✂</span>'S</div><div class="logoSub">BARBER</div></div>
<div style="display:flex;gap:8px"><div class="switch"><button id="light" class="active">☀</button><button id="dark">☾</button></div><button class="icon" id="gear">⚙</button></div>
</header>
<div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Conectando con Firebase…</span></div>
<main class="layout">
<aside class="side" id="side">
<div class="card"><h3>✂ Servicios y Precios</h3><div class="services" id="serviceList"></div></div>
<div class="card"><h3>⚙ Ajustes</h3><div class="setting">◷ Horarios de Trabajo</div><div class="setting">☷ Servicios y Precios</div><div class="setting">☁ Sincronización</div><div class="setting">◉ Tema de Fondo</div></div>
</aside>
<section class="content">
<div class="stickyAgendaHead">
<div class="datebar"><button id="prev">‹</button><div class="datebox" id="dateLabel"></div><button id="next">›</button><button id="today">Hoy</button></div>
<button class="new" id="newBtn">＋ Nueva Cita</button>
</div>
<div class="schedule" id="schedule"></div>
<div class="footer"><div>⚪ Próximas</div><div>🟡 En Curso</div><div>🔴 Pasadas</div><div class="badge">Total del día: $<span id="dayTotal">0.00</span></div></div>
</section>
</main>
</div>

<dialog id="apptDlg"><form class="modal" id="apptForm"><h2 id="apptTitle">Nueva cita</h2>
<div class="grid2"><div><label>Fecha</label><input id="dateInput" type="date" required></div><div><label>Hora</label><input id="timeInput" type="time" required></div></div>
<label>Cliente (opcional)</label><input id="clientInput">
<label>Teléfono / WhatsApp (opcional)</label><input id="phoneInput">
<label>Servicios</label><div id="picker"></div>
<div class="total"><span>Total</span><span>$<span id="apptTotal">0.00</span></span></div>
<label>Notas (opcional)</label><textarea id="notesInput"></textarea>
<div class="macts"><button type="button" id="delAppt" style="display:none;color:#d00">Eliminar</button><button type="button" id="cancelAppt">Cancelar</button><button class="save" type="submit">Guardar</button></div>
</form></dialog>

<dialog id="settingsDlg"><div class="modal"><h2>⚙ Ajustes</h2>
<div class="grid2"><div><label>Apertura</label><input id="openTime" type="time"></div><div><label>Cierre</label><input id="closeTime" type="time"></div></div>
<label>Intervalo de citas</label><select id="interval"><option value="10">10 minutos</option><option value="15">15 minutos</option><option value="20">20 minutos</option><option value="30">30 minutos</option></select>
<label>✂ Recorte</label><input id="recortePrice" type="number" min="0" step=".01">
<label>🧔 Barba</label><input id="barbaPrice" type="number" min="0" step=".01">
<label>〰 Cejas</label><input id="cejasPrice" type="number" min="0" step=".01">
<label>✦ Refine</label><input id="refinePrice" type="number" min="0" step="0.01" placeholder="Precio">
<h3>Servicios adicionales</h3><div id="customList"></div><button class="gold" id="addService" type="button">＋ Añadir Servicio</button>
<div class="macts"><button id="closeSettings" type="button">Cancelar</button><button class="save" id="saveSettings" type="button">Guardar ajustes</button></div>
</div></dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDtG3Aaxb9EAE2IeaWtil23elLQr_1SkwM",
authDomain:"emas-barber.firebaseapp.com",
projectId:"emas-barber",
storageBucket:"emas-barber.firebasestorage.app",
messagingSenderId:"794165974241",
appId:"1:794165974241:web:c6707a0e3f8ab8181953a0",
measurementId:"G-Z44H3W0Q1Z"
};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const appointmentsCol=collection(db,"appointments"),settingsRef=doc(db,"settings","main");
let appointments={},editing=null,day=new Date();
let settings={open:"05:00",close:"18:50",interval:10,theme:"light",services:[{name:"Recorte",icon:"✂",price:0},{name:"Barba",icon:"🧔",price:0},{name:"Cejas",icon:"〰",price:0},{name:"Refine",icon:"✦",price:0}]};
const $=id=>document.getElementById(id);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const idFor=(d,t)=>`${d}_${t.replace(":","")}`;
function showTime(t){let[h,m]=t.split(":").map(Number);return `${h%12||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`}
function total(a){return(a.services||[]).reduce((s,x)=>s+Number(x.price||0),0)}
function past(d,t){let[y,m,da]=d.split("-").map(Number),[h,mi]=t.split(":").map(Number);return new Date(y,m-1,da,h,mi)<new Date()}
function current(d,t){let[y,m,da]=d.split("-").map(Number),[h,mi]=t.split(":").map(Number),s=new Date(y,m-1,da,h,mi),e=new Date(s.getTime()+settings.interval*60000),n=new Date();return n>=s&&n<e}
function sync(ok,msg){$("syncDot").className="dot "+(ok===true?"ok":ok===false?"err":"");$("syncText").textContent=msg}
function applyTheme(){document.documentElement.dataset.theme=settings.theme==="dark"?"dark":"light";$("light").classList.toggle("active",settings.theme!=="dark");$("dark").classList.toggle("active",settings.theme==="dark")}
function renderServices(){$("serviceList").innerHTML=settings.services.map(s=>`<div class="service"><div>${s.icon||"✦"}</div><div>${s.name}</div><div class="price">$${Number(s.price||0).toFixed(2)}</div></div>`).join("")}
function render(){
$("dateLabel").textContent=day.toLocaleDateString("es-PR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("schedule").innerHTML="";let d=ymd(day),sum=0,[oh,om]=settings.open.split(":").map(Number),[ch,cm]=settings.close.split(":").map(Number);
for(let n=oh*60+om;n<=ch*60+cm;n+=Number(settings.interval)){
let h=Math.floor(n/60),m=n%60,t=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`,id=idFor(d,t),a=appointments[id],row=document.createElement("div");row.className="slot";
if(!a)row.classList.add("available");if(a&&current(d,t))row.classList.add("current");else if(a&&past(d,t))row.classList.add("past");
let center=a?`<div class="name">${a.client||"Cita"}${current(d,t)?'<span class="now">Ahora</span>':""}</div><div class="svc">${(a.services||[]).map(x=>x.name).join(" + ")||"Sin servicio"} · $${total(a).toFixed(2)}</div>`:`<div class="svc">— Disponible —</div>`;
if(a)sum+=total(a);
row.innerHTML=`<div class="time">${showTime(t)}</div><div>${center}</div><div class="actions">${a?'<button class="edit">✎</button><button class="trash">⌫</button>':""}</div>`;
if(a){row.querySelector(".name").onclick=async e=>{e.stopPropagation();if(confirm("¿Borrar esta cita?"))await deleteDoc(doc(db,"appointments",id))};row.querySelector(".edit").onclick=e=>{e.stopPropagation();openAppt(d,t,id)};row.querySelector(".trash").onclick=async e=>{e.stopPropagation();if(confirm("¿Eliminar esta cita?"))await deleteDoc(doc(db,"appointments",id))}}
row.onclick=()=>openAppt(d,t,a?id:null);$("schedule").appendChild(row)}
$("dayTotal").textContent=sum.toFixed(2)}
function buildPicker(a={}){$("picker").innerHTML="";let map={};(a.services||[]).forEach(s=>map[s.name]=s.price);settings.services.forEach(s=>{let checked=map[s.name]!==undefined,row=document.createElement("div");row.className="pick";row.innerHTML=`<input class="check" data-name="${s.name}" type="checkbox" ${checked?"checked":""}><div>${s.icon||"✦"}</div><div><b>${s.name}</b></div><input class="pval" data-name="${s.name}" type="number" min="0" step=".01" value="${checked?map[s.name]:s.price}">`;$("picker").appendChild(row)});document.querySelectorAll(".check,.pval").forEach(x=>x.oninput=calc)}
function calc(){let s=0;document.querySelectorAll(".check").forEach(c=>{if(c.checked){let p=[...document.querySelectorAll(".pval")].find(x=>x.dataset.name===c.dataset.name);s+=Number(p?.value||0)}});$("apptTotal").textContent=s.toFixed(2)}
function openAppt(d,t,id=null){editing=id;let a=id?appointments[id]:{};$("apptTitle").textContent=id?"Editar cita":"Nueva cita";$("dateInput").value=d;$("timeInput").value=t;$("timeInput").step=settings.interval*60;$("clientInput").value=a?.client||"";$("phoneInput").value=a?.phone||"";$("notesInput").value=a?.notes||"";buildPicker(a||{});calc();$("delAppt").style.display=id?"inline-block":"none";$("apptDlg").showModal()}
$("apptForm").onsubmit=async e=>{e.preventDefault();let d=$("dateInput").value,t=$("timeInput").value,id=idFor(d,t),services=[];document.querySelectorAll(".check").forEach(c=>{if(c.checked){let p=[...document.querySelectorAll(".pval")].find(x=>x.dataset.name===c.dataset.name);services.push({name:c.dataset.name,price:Number(p?.value||0)})}});if(editing&&editing!==id)await deleteDoc(doc(db,"appointments",editing));await setDoc(doc(db,"appointments",id),{id,date:d,time:t,client:$("clientInput").value.trim(),phone:$("phoneInput").value.trim(),notes:$("notesInput").value.trim(),services,updatedAt:Date.now()});$("apptDlg").close()}
$("delAppt").onclick=async()=>{if(editing&&confirm("¿Eliminar esta cita?")){await deleteDoc(doc(db,"appointments",editing));$("apptDlg").close()}};$("cancelAppt").onclick=()=>$("apptDlg").close();
$("prev").onclick=()=>{day.setDate(day.getDate()-1);render()};$("next").onclick=()=>{day.setDate(day.getDate()+1);render()};$("today").onclick=()=>{day=new Date();render()};$("newBtn").onclick=()=>openAppt(ymd(day),"09:00");$("menu").onclick=()=>$("side").classList.toggle("open");
$("light").onclick=async()=>{settings.theme="light";applyTheme();await setDoc(settingsRef,settings)};$("dark").onclick=async()=>{settings.theme="dark";applyTheme();await setDoc(settingsRef,settings)};
function customServices(){return settings.services.filter(s=>!["Recorte","Barba","Cejas","Refine"].includes(s.name))}
function renderCustom(){$("customList").innerHTML="";customServices().forEach((s,i)=>{let r=document.createElement("div");r.className="custom";r.innerHTML=`<input class="cname" data-i="${i}" value="${s.name}"><input class="cprice" data-i="${i}" type="number" min="0" step=".01" value="${s.price}"><button class="icon rem" data-i="${i}" type="button">×</button>`;$("customList").appendChild(r)});document.querySelectorAll(".rem").forEach(b=>b.onclick=()=>{let fixed=settings.services.filter(s=>["Recorte","Barba","Cejas","Refine"].includes(s.name)),c=customServices();c.splice(Number(b.dataset.i),1);settings.services=fixed.concat(c);renderCustom()})}
function loadSettings(){$("openTime").value=settings.open;$("closeTime").value=settings.close;$("interval").value=String(settings.interval);$("recortePrice").value=settings.services.find(s=>s.name==="Recorte")?.price||0;$("barbaPrice").value=settings.services.find(s=>s.name==="Barba")?.price||0;$("cejasPrice").value=settings.services.find(s=>s.name==="Cejas")?.price||0;renderCustom()}
$("gear").onclick=()=>{loadSettings();$("settingsDlg").showModal()};$("closeSettings").onclick=()=>$("settingsDlg").close();$("addService").onclick=()=>{settings.services.push({name:"Servicio adicional",icon:"✦",price:0});renderCustom()};
$("saveSettings").onclick=async()=>{let c=customServices();document.querySelectorAll(".cname").forEach(x=>{if(c[x.dataset.i])c[x.dataset.i].name=x.value.trim()||"Servicio adicional"});document.querySelectorAll(".cprice").forEach(x=>{if(c[x.dataset.i])c[x.dataset.i].price=Number(x.value||0)});settings.open=$("openTime").value||"05:00";settings.close=$("closeTime").value||"18:50";settings.interval=Number($("interval").value||10);settings.services=[{name:"Recorte",icon:"✂",price:Number($("recortePrice").value||0)},{name:"Barba",icon:"🧔",price:Number($("barbaPrice").value||0)},{name:"Cejas",icon:"〰",price:Number($("cejasPrice").value||0)},{name:"Refine",icon:"✦",price:Number($("refinePrice")?.value||0)},...c];await setDoc(settingsRef,settings);$("settingsDlg").close()};
onSnapshot(settingsRef,async s=>{
  if(s.exists()) settings={...settings,...s.data()};
  let changed=false;
  settings.services=(settings.services||[]).flatMap(x=>{
    if(x.name==="Refine de cejas"){
      changed=true;
      return [{...x,name:"Cejas"},{name:"Refine",icon:"✦",price:0}];
    }
    return [x];
  });
  if(!(settings.services||[]).some(x=>x.name==="Cejas")){settings.services.push({name:"Cejas",icon:"〰",price:0});changed=true;}
  if(!(settings.services||[]).some(x=>x.name==="Refine")){settings.services.push({name:"Refine",icon:"✦",price:0});changed=true;}
  if(changed) await setDoc(settingsRef,settings);
  applyTheme();renderServices();render();sync(true,"Sincronizado con Firebase");
},e=>sync(false,"Error con Firebase"));
onSnapshot(appointmentsCol,s=>{appointments={};s.forEach(d=>appointments[d.id]={...d.data(),id:d.id});render();sync(true,"Citas sincronizadas en tiempo real")},e=>sync(false,"No se pudieron cargar las citas"));
(async()=>{let s=await getDoc(settingsRef);if(!s.exists())await setDoc(settingsRef,settings)})().catch(()=>sync(false,"Revisa las reglas de Firestore"));
setInterval(render,60000);applyTheme();renderServices();render();
</script>
</body></html>
